<style>
  .notfound {
    min-height: 100vh;

  }

  .notfound p {
    margin: 16px 0 0;

    font-size: 13.5px;
  }

  .notfound-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 30px;
  }

  .notfound-foot {
