[package]
name    = "archoera-downloader"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "ArchoeraMusic 下载引擎（cdylib）：Kugou/Netease 自研签名 + HTTP 流式下载 + FFI 回调"
publish = false

[lib]
name      = "archoera_downloader"
# rlib 仅为 tests/ 集成测试提供可链接产物（生产只产出 .so，不安装 rlib）
crate-type= ["cdylib", "staticlib", "rlib"]

[dependencies]
# ====== 下载核心（自研方案：reqwest chunk loop）======
# 说明：不使用 stream-download / 第三方平台 SDK / SPlayer 下载驱动（避免 GitHub 链接影响编译），
# 下载核心采用 reqwest 流式 chunk 循环 + tmp 原子 rename。
reqwest           = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form"] }
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
futures           = "0.3"
once_cell         = "1"
log               = { version = "0.4", features = ["std"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = { version = "1", features = ["preserve_order"] }
anyhow            = "1"
uuid              = { version = "1", features = ["v4", "serde"] }
base64            = "0.23"

# ====== 自研签名核心（Kugou + Netease 共用，全部 MIT/Apache-2.0 RustCrypto 官方 crate）======
aes               = "0.9"
cbc               = { version = "0.2", features = ["alloc"] }
md-5              = "0.11"
# getrandom：启用 rsa 自带的 OS 熵源（rand_core 0.6 的 OsRng），用于 PKCS1v1.5
# 随机填充；rsa 0.9 尚未跟进 rand_core 0.9/0.10，故与应用侧 rand 0.10 分开取熵。
rsa               = { version = "0.9", features = ["pem", "getrandom"] }
rand              = "0.10"
hex               = "0.4"

# ====== v2 增强：下载完成写音乐标签（MIT/Apache-2.0）======
# 0.19 格式支持随默认 features 全开（mp3 → id3v2；flac → vorbis comment）。
lofty            = "0.25"

# ====== v2.1 增强：KRC 歌词解密（酷狗逐字歌词）======
# krc 非完全加密：base64 去头 4 字节 → 16 字节定 key 循环 XOR → zlib inflate。
# flate2 默认 miniz_oxide backend（纯 Rust，无 C 依赖），MIT/Apache-2.0。
flate2           = "1"

# ====== 内存保护（vault-3）：mlock 禁 swap + zeroize 防残留明文 ======
# mlock/munlock（unix）+ MADV_DONTDUMP（Linux）；Windows VirtualLock 见下方
# [target.'cfg(windows)'.dependencies]。
zeroize          = { version = "1", default-features = false, features = ["alloc"] }
libc             = "0.2"

[target.'cfg(windows)'.dependencies]
# VirtualLock/VirtualUnlock 位于 Win32_System_Memory，但签名引用 Foundation::BOOL，
# 必须同时启用 Win32_Foundation，否则 E0425（Windows CI 已实测复现）。
windows-sys      = { version = "0.61", features = ["Win32_System_Memory", "Win32_Foundation"] }

# Windows 版本资源（VERSIONINFO + 图标）；build.rs 在非 Windows 宿主/目标跳过。
[build-dependencies]
winres = "0.1"

[profile.release]
lto       = true
strip     = "symbols"
opt-level = "s"

[patch.crates-io]
# RUSTSEC-2024-0436：lofty 0.25.5 仍依赖已停维护的 paste。vendor/lofty 仅把
# paste 换成 API 兼容的 pastey；升级 lofty 时同步重打该补丁（见 vendor/lofty/VENDOR.md）。
lofty = { path = "vendor/lofty" }
