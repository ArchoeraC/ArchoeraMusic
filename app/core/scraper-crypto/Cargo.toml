[package]
name = "archoera-scraper-crypto"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "ArchoeraMusic 刮削器加密后端（AES / RSA 模幂 / 摘要 / 随机数），替代 OpenSSL::Crypto"
publish = false

[lib]
name = "archoera_scraper_crypto"
# staticlib 供 C++ scraper 直接链入（Linux/macOS/Windows 均静态合并）；
# rlib 供 cargo test 使用。
crate-type = ["staticlib", "rlib"]

[dependencies]
aes = "0.8"
md-5 = "0.10"
sha1 = "0.10"
num-bigint = "0.4"
getrandom = "0.2"

[profile.release]
lto = true
strip = true
debug = false
# panic 不跨越 C ABI：任何内部 panic 直接 abort，避免 unwind 进入 C++ 栈。
panic = "abort"
opt-level = 3
