# =====================================================================
#  按发行版/平台分开构建 + tag(v*) Release。
#
#  Linux 为何不共用一份产物：引擎链接 FFmpeg、scraper 链接 TagLib，二者
#  soname 跨发行版会 bump（libavformat.so.60→.63、libtag.so.1→.2）。在单一
#  发行版（Ubuntu）上构建再重打包，会在别的发行版上因 soname 不匹配而无法
#  加载（实测 Arch 上引擎与 scraper 均加载失败）。故每个发行版在自己的容器
#  内从源码构建，链接并使用该发行版自身的 FFmpeg/TagLib。
#
#  ┌─ linux-deb     (ubuntu-24.04 runner) : ubuntu24.04.deb + linux tar.gz（并上传原始 bundle）
#  ├─ linux-deepin  (Deepin 25 容器)      : deepin25.deb（老 glibc 基线；失败即放弃）
#  ├─ linux-rpm     (fedora 容器)         : fedora.rpm
#  ├─ linux-arch    (archlinux 容器)      : arch.pkg.tar.zst
#  ├─ linux-appimage(needs linux-deb)     : AppImage（linuxdeploy 收拢动态依赖）
#  ├─ linux-flatpak (needs linux-deb)     : .flatpak（包装预构建 bundle）
#  ├─ linux-nix     (独立源构建)          : NixOS flake 产物 tar.gz（nixpkgs 工具链）
#  ├─ build         (matrix macos/windows): macOS DMG+zip / Inno Setup installer+portable zip
#  └─ release       (needs 全部；tag v* 触发)
#
#  产物文件名带发行版标识（如 ArchoeraMusic-v<ver>-ubuntu24.04-x86_64.deb、
#  -fedora-x86_64.rpm、-arch-x86_64.pkg.tar.zst），且包内 BUILD-INFO.txt 写明
#  构建目标 / 基线 / 最低 glibc / 提交，用户无需靠后缀猜适用性。
#
#  各发行版 Linux job 共用 .github/actions/build-linux（复合 action）：工具链
#  (rust/go/dotnet/flutter) → Zig 0.17 → build-linux.sh → pub get/analyze →
#  flutter build linux。**CI 不跑测试**：单测/回归按 AGENTS.md 的「提交前必跑」
#  在本地执行（完整套件曾把流水线拖到数十分钟甚至挂死）。发行版专属的系统
#  依赖安装与打包由各 job 负责。
#
#  macOS/Windows job：工具链 → 一站式原生构建（build-macos.sh / build_windows.bat，
#  含 archoerashell staticlib + vault-rs 凭据保险库）→ pub get/analyze → flutter
#  build（经内嵌 cargo/脚本阶段链入 archoerashell；vault 由 bundle 步骤/CMake
#  install 收入 native/）→ 打包。
#
#  Zig 0.17 安装沿用已修复逻辑（f99266b / 7116dfc）：归档名按 0.15.1+ 新规则
#  zig-<arch>-<os>；GITHUB_PATH 对当前步骤不生效，同步骤内用绝对路径验证。
#
#  ┌─ release job ─────────────────────────────────────────────────────
#  │  needs: [preflight, build, linux-deb, linux-rpm, linux-arch, linux-deepin,
#  │          linux-appimage, linux-flatpak, linux-nix]；仅 push tag v* 触发；
#  │  下载全部 artifact 后聚合为 GitHub Release。release 需要 contents: write，
#  │  故在 job 级覆盖顶层 permissions。tag 名即版本（沿用仓库现有 v* 标签）。
#  └──────────────────────────────────────────────────────────────────
#
#  ┌─ preflight（点菜）────────────────────────────────────────────────
#  │  workflow_dispatch 可勾选构建哪些平台（默认全选）：macos / windows /
#  │  linux_deb / linux_deepin / linux_rpm / linux_arch / linux_appimage /
#  │  linux_flatpak / linux_nix。preflight 将其解析为各 job 的开关 + build
#  │  matrix（macos/windows 按选择动态生成）；勾选 AppImage/Flatpak 会自动
#  │  带上 linux_deb（其依赖原始 bundle）。push tag v* 忽略选择、强制全选。
#  │  **九项全选才允许 release**：未全选的手动运行永远不会有 release。
#  └──────────────────────────────────────────────────────────────────
name: Build all platforms & release

on:
  # ── 「点菜」：手动触发时按勾选平台构建（默认全选）─────────────────────────
  #  push tag v* 时忽略选择、强制全选（发版必须全平台）；且 release 仅在
  #  「九项全选」时才放行（未全选的 workflow_dispatch 永远不会有 release）。
  #  AppImage / Flatpak 依赖 Ubuntu .deb 的原始 bundle → 勾选它们会自动带上
  #  linux_deb（见 preflight）。
  workflow_dispatch:
    inputs:
      macos:
        description: 'macOS（.app，arm64 + x86_64）'
        type: boolean
        default: true
      windows:
        description: 'Windows（Inno Setup 安装器 + 便携 zip）'
        type: boolean
        default: true
      linux_deb:
        description: 'Linux .deb（Ubuntu 24.04；AppImage/Flatpak 依赖它）'
        type: boolean
        default: true
      linux_deepin:
        description: 'Linux .deb（Deepin 25）'
        type: boolean
        default: true
      linux_rpm:
        description: 'Linux .rpm（Fedora）'
        type: boolean
        default: true
      linux_arch:
        description: 'Linux .pkg.tar.zst（Arch）'
        type: boolean
        default: true
      linux_appimage:
        description: 'Linux AppImage（勾选会自动带上 .deb）'
        type: boolean
        default: true
      linux_flatpak:
        description: 'Linux Flatpak（勾选会自动带上 .deb）'
        type: boolean
        default: true
      linux_nix:
        description: 'Linux NixOS（源码 flake）'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read


jobs:
  # =====================================================================
  #  preflight：解析「点菜」选择 → 各 job 开关 + build(macos/windows) matrix。
  #  - push tag v*：忽略选择、强制全选（发版必须全平台）。
  #  - workflow_dispatch：按勾选；AppImage/Flatpak 自动带上 linux_deb。
  #  - all_selected：九项全选才为 true（release 的放行条件之一）。
  # =====================================================================
  preflight:
    name: Preflight (platform selection)
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.sel.outputs.macos }}
      windows: ${{ steps.sel.outputs.windows }}
      linux_deb: ${{ steps.sel.outputs.linux_deb }}
      linux_deepin: ${{ steps.sel.outputs.linux_deepin }}
      linux_rpm: ${{ steps.sel.outputs.linux_rpm }}
      linux_arch: ${{ steps.sel.outputs.linux_arch }}
      linux_appimage: ${{ steps.sel.outputs.linux_appimage }}
      linux_flatpak: ${{ steps.sel.outputs.linux_flatpak }}
      linux_nix: ${{ steps.sel.outputs.linux_nix }}
      build_matrix: ${{ steps.sel.outputs.build_matrix }}
      all_selected: ${{ steps.sel.outputs.all_selected }}
    steps:
      - id: sel
        shell: bash
        env:
          EV: ${{ github.event_name }}
          IN_MACOS: ${{ inputs.macos }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_LINUX_DEB: ${{ inputs.linux_deb }}
          IN_LINUX_DEEPIN: ${{ inputs.linux_deepin }}
          IN_LINUX_RPM: ${{ inputs.linux_rpm }}
          IN_LINUX_ARCH: ${{ inputs.linux_arch }}
          IN_LINUX_APPIMAGE: ${{ inputs.linux_appimage }}
          IN_LINUX_FLATPAK: ${{ inputs.linux_flatpak }}
          IN_LINUX_NIX: ${{ inputs.linux_nix }}
        run: |
          set -euo pipefail
          truthy() { case "${1:-}" in true|TRUE|True|1|yes|YES) echo true ;; *) echo false ;; esac; }
          if [ "$EV" = "push" ]; then
            # tag 发版：忽略点菜、强制全选（发版必须全平台）。
            MACOS=true; WINDOWS=true; DEB=true; DEEPIN=true; RPM=true
            ARCH=true; APPIMAGE=true; FLATPAK=true; NIX=true
          else
            MACOS=$(truthy "$IN_MACOS"); WINDOWS=$(truthy "$IN_WINDOWS")
            DEB=$(truthy "$IN_LINUX_DEB"); DEEPIN=$(truthy "$IN_LINUX_DEEPIN")
            RPM=$(truthy "$IN_LINUX_RPM"); ARCH=$(truthy "$IN_LINUX_ARCH")
            APPIMAGE=$(truthy "$IN_LINUX_APPIMAGE"); FLATPAK=$(truthy "$IN_LINUX_FLATPAK")
            NIX=$(truthy "$IN_LINUX_NIX")
          fi
          # AppImage / Flatpak 消费 Ubuntu .deb 的原始 bundle → 自动带上 deb。
          if [ "$APPIMAGE" = true ] || [ "$FLATPAK" = true ]; then DEB=true; fi

          {
            echo "macos=$MACOS"
            echo "windows=$WINDOWS"
            echo "linux_deb=$DEB"
            echo "linux_deepin=$DEEPIN"
            echo "linux_rpm=$RPM"
            echo "linux_arch=$ARCH"
            echo "linux_appimage=$APPIMAGE"
            echo "linux_flatpak=$FLATPAK"
            echo "linux_nix=$NIX"
          } >> "$GITHUB_OUTPUT"

          # build（macos/windows matrix）：按选择组装，供 build 动态 matrix 使用。
          # macOS 两个条目共用 os=macos，后续步骤仍按 matrix.os 判断；arch/rid/
          # artifact 决定单架构构建与产物名。不能把两个架构塞进一个 universal
          # 包：native/ 下各模块按单架构构建，且 Flutter 已在弃用 universal。
          ENTRIES=""
          add() { ENTRIES="${ENTRIES}${ENTRIES:+,}{\"os\":\"$1\",\"runner\":\"$2\",\"zig_archive\":\"$3\",\"arch\":\"$4\",\"rid\":\"$5\",\"artifact\":\"$6\"}"; }
          if [ "$MACOS" = true ]; then
            add macos macos-15 aarch64-macos arm64 osx-arm64 macos-arm64
            # macos-15-intel 是 GitHub 当前最后一条 x86_64 托管镜像（可用至约
            # 2027-08）；之后可评估 macos-26-intel 或改自托管/交叉构建。
            add macos macos-15-intel x86_64-macos x86_64 osx-x64 macos-x64
          fi
          if [ "$WINDOWS" = true ]; then add windows windows-latest x86_64-windows x64 "" windows-x64; fi
          # 全不选时给一个占位条目（build 的 job 级 if 会把它跳过），避免空矩阵。
          if [ -z "$ENTRIES" ]; then
            ENTRIES='{"os":"none","runner":"ubuntu-latest","zig_archive":"","arch":"","rid":"","artifact":""}'
          fi
          echo "build_matrix=[$ENTRIES]" >> "$GITHUB_OUTPUT"

          # 九项全选才允许 release。
          if [ "$MACOS" = true ] && [ "$WINDOWS" = true ] && [ "$DEB" = true ] \
             && [ "$DEEPIN" = true ] && [ "$RPM" = true ] && [ "$ARCH" = true ] \
             && [ "$APPIMAGE" = true ] && [ "$FLATPAK" = true ] && [ "$NIX" = true ]; then
            echo "all_selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_selected=false" >> "$GITHUB_OUTPUT"
          fi

          echo "── 点菜结果 ── macos=$MACOS windows=$WINDOWS deb=$DEB deepin=$DEEPIN rpm=$RPM arch=$ARCH appimage=$APPIMAGE flatpak=$FLATPAK nix=$NIX"

  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    needs: preflight
    if: needs.preflight.outputs.macos == 'true' || needs.preflight.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # ───────────────────────── macOS（Homebrew 依赖）────────────────
      - name: Install Homebrew deps
        if: matrix.os == 'macos'
        # macos-15（Xcode 16）:macOS 14 runner 为 Xcode 15.4，其 /usr/lib/swift
        # 缺少 libswift_Builtin_float 等 stub，NativeAOT Swift autolink 报 8 个
        # __swift_FORCE_LOAD_$_swift_* 未定义（dotnet/runtime#125858 官方答复
        # 要求 Xcode 16+，googleads-ios-unity#3760）。Xcode 16 SDK 含完整 stubs。
        # 不装 brew 的 ffmpeg：它默认 --enable-gpl（GPL-3.0），破坏本项目
        # THIRD-PARTY-LICENSES 的「GPL 防火墙」；改用自建纯 LGPL 最小 FFmpeg
        # （见 build-ffmpeg-minimal.sh）。dylibbundler 用于把 FFmpeg/TagLib
        # dylib 收进 .app 并改写 install_name（自包含）。nasm 让 x86_64 FFmpeg
        # 启用汇编加速；缺省会自动 --disable-x86asm（Intel 上解码明显变慢）。
        run: |
          brew install taglib sqlite nlohmann-json pkg-config dylibbundler opus nasm

      # ───────────────────────── Windows（mingw / vcpkg）───────────────
      - name: Install mingw (cgo C 编译器，go -buildmode=c-shared 需要)
        if: matrix.os == 'windows'
        shell: pwsh
        # Chocolatey 包依赖 GitHub Release 资产；504 时不要让整个 job 直接失败，
        # 后面用 runner 自带 MSYS2 或镜像下载的 mingw 兜底。
        continue-on-error: true
        run: choco install mingw -y --no-progress

      - name: Ensure mingw on PATH (Chocolatey 504 fallback)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if (Get-Command gcc.exe -ErrorAction SilentlyContinue) {
            Write-Host "gcc 已在 PATH"; exit 0
          }
          $candidates = @(
            "C:\msys64\mingw64\bin",
            "C:\msys64\ucrt64\bin",
            "C:\mingw64\bin",
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          )
          foreach ($dir in $candidates) {
            if (Test-Path (Join-Path $dir "gcc.exe")) {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              Write-Host "使用已有 mingw: $dir"; exit 0
            }
          }

          $asset = "x86_64-16.2.0-release-posix-seh-ucrt-rt_v14-rev1.7z"
          $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/$asset"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $ok = $false
          foreach ($u in @(
              $url,
              "https://ghproxy.net/$url",
              "https://gh-proxy.com/$url",
              "https://ghfast.top/$url",
              "https://gh.moeyy.xyz/$url",
              "https://ghproxy.cc/$url",
              "https://gh.llkk.cc/$url")) {
            try {
              curl.exe -fL --retry 2 --retry-delay 5 -o $archive $u
              if ((Get-Item $archive).Length -gt 10MB) { $ok = $true; break }
            } catch { Write-Warning "下载失败: $u" }
          }
          if (-not $ok) { Write-Error "无法获取 mingw（Chocolatey 与镜像均失败）"; exit 1 }
          7z x $archive -o"C:\" -y | Out-Null
          "C:\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "C:\mingw64\bin\gcc.exe" --version | Select-Object -First 1

      - name: Cache vcpkg installed (恢复；ffmpeg/taglib 等预编译跨 run 秒级恢复)
        if: matrix.os == 'windows'
        id: vcpkg-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # 同时缓存 vcpkg 二进制缓存（archives）：只缓存 vcpkg_installed 时
          # vcpkg install 仍会因 ABI/完整性校验重编 ffmpeg（~13 分钟）；缓存
          # archives 后可直接命中预编译包。
          path: |
            app/vcpkg_installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-installed-${{ hashFiles('app/vcpkg.json') }}

      # GitHub Release 资产偶发 504：先从官方/镜像预取 vcpkg 需要的
      # Strawberry Perl（openssl 构建依赖），并用 vcpkg 自带的 SHA512 校验。
      # 失败不致命，vcpkg 仍会按原逻辑直连下载。
      - name: Prefetch vcpkg tools (GitHub 504 fallback)
        if: matrix.os == 'windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $tool = "C:\vcpkg\scripts\cmake\vcpkg_find_acquire_program(PERL).cmake"
          if (-not (Test-Path $tool)) { Write-Warning "未找到 vcpkg perl 工具定义"; exit 0 }
          $c = Get-Content $tool -Raw
          $fn = [regex]::Match($c, 'set\(download_filename "([^"]+)"\)').Groups[1].Value
          $sha = [regex]::Match($c, 'set\(download_sha512 ([0-9a-fA-F]+)\)').Groups[1].Value
          $url = [regex]::Match($c, 'set\(download_urls\s*\n?\s*"([^"]+)"').Groups[1].Value
          if (-not $fn -or -not $sha -or -not $url) {
            Write-Warning "无法解析 vcpkg perl 工具定义"; exit 0
          }
          $zip = Join-Path "C:\vcpkg\downloads" $fn
          if ((Test-Path $zip) -and
              ((Get-FileHash $zip -Algorithm SHA512).Hash.ToLower() -eq $sha.ToLower())) {
            Write-Host "Strawberry Perl 已在 vcpkg 缓存中"; exit 0
          }
          New-Item -ItemType Directory -Force -Path (Split-Path $zip) | Out-Null
          foreach ($u in @(
              $url,
              "https://ghproxy.net/$url",
              "https://gh-proxy.com/$url",
              "https://ghfast.top/$url",
              "https://gh.moeyy.xyz/$url",
              "https://ghproxy.cc/$url",
              "https://gh.llkk.cc/$url")) {
            try {
              curl.exe -fL --retry 2 --retry-delay 5 -o "$zip.part" $u
              if ((Get-FileHash "$zip.part" -Algorithm SHA512).Hash.ToLower() -eq $sha.ToLower()) {
                Move-Item "$zip.part" $zip -Force
                Write-Host "已从镜像获取: $u"
                exit 0
              }
              Write-Warning "SHA512 不匹配: $u"
            } catch {
              Write-Warning "下载失败: $u"
            }
            Remove-Item "$zip.part" -ErrorAction SilentlyContinue
          }
          Write-Warning "所有源均失败，交由 vcpkg 直连重试"

      - name: Install vcpkg deps (manifest 模式，依赖清单见 app/vcpkg.json)
        if: matrix.os == 'windows'
        shell: bash
        working-directory: app
        # x64-windows-release：只编译/安装 Release 库，跳过 debug 变体
        # （ffmpeg 等包 debug+release 双编译耗时可省一半，且无 debug 库可被误链）
        # 注意：manifest 模式安装根固定为 ./vcpkg_installed，不受 VCPKG_INSTALLED_DIR
        # 环境变量影响，不要手动覆盖以免与 CMake toolchain 的定位不一致。
        # 此处显式 install 仅为 vcpkg_installed 缓存加速；build_windows.bat 内含
        # headers 缺失时自动 install 的幂等兜底，本地开发无需手动预装。
        # 输出重定向到文件、只回显尾部：vcpkg 编译 ffmpeg 会打印海量 `\r` 进度行，
        # 直接进 Actions 日志会让网页日志查看器卡死（表现为「步骤点不开」）。
        run: |
          vcpkg install --triplet x64-windows-release > vcpkg-install.log 2>&1 || {
            echo "::error::vcpkg install 失败，尾部日志："; tail -200 vcpkg-install.log; exit 1;
          }
          echo "vcpkg install 完成"; tail -20 vcpkg-install.log
        env:
          VCPKG_ROOT: C:\vcpkg

      # 可选：C++/WinRT 投影头（原生 Toast 用）。失败不致命——build_windows.bat
      # 仅在头存在时才启用 win_toast.cpp；否则 Zig 弱符号兜底走 PowerShell 调 WinRT。
      # classic 模式（从 runner.temp 运行，避免 manifest 模式拒绝单包参数）。
      - name: Install C++/WinRT headers (Windows, 可选：原生 Toast)
        if: matrix.os == 'windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        continue-on-error: true
        run: vcpkg install cppwinrt --triplet x64-windows-release
        env:
          VCPKG_ROOT: C:\vcpkg

      # save-always 已弃用（job 失败时不生效），改为显式 save：
      # vcpkg install 成功后立即落缓存，此后任意步骤失败均不影响复用
      - name: Cache vcpkg installed (保存，供下次 run 秒级恢复)
        if: matrix.os == 'windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            app/vcpkg_installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-installed-${{ hashFiles('app/vcpkg.json') }}

      # ──────────────────────── 工具链（三端共用）─────────────────────
      # CMake 用 runner 自带版本（ubuntu-24.04 = 3.28.3，满足 FindSQLite3 3.14+）；
      # 不引入 actions-setup-cmake：其版本解析走 GitHub releases 分页，
      # 旧版本号（如 v3.28.7）超出分页范围会报 Unable to find version
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Add macOS Rust targets
        if: matrix.os == 'macos'
        # 每次构建只产单架构；vault 按 matrix.rid 选一个 target，archoerashell
        # 的 Xcode 脚本按 ARCHS 取对应 target。两个都装上，便于本地/未来切换。
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache-dependency-path: app/core/subsonic/go.sum
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # 固定 Flutter 版本（与本地开发/`pubspec.lock` 对齐），不要用 channel: stable：
          # 2026-11-12 stable 滚到 3.50.0 后，`nativeapi`（经 window_manager 0.6 引入）
          # 的 `Isolate.create` 在该版本已被移除，全平台 kernel_snapshot 一起编译失败。
          # 升级 Flutter 前请先确认 nativeapi / cnativeapi 已支持目标版本。
          flutter-version: '3.47.9'
          cache: true

      # ──────────────────── Zig 0.17（EraAudio kernel）────────────────
      - name: Install Zig 0.17 (EraAudio kernel)
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          VER=0.17.0
          ZA="${{ matrix.zig_archive }}"
          ZD="$HOME/.local/zig-$VER"
          if [ ! -x "$ZD/zig" ]; then
            mkdir -p "$HOME/.local"
            curl -fsSL "https://ziglang.org/download/$VER/zig-$ZA-$VER.tar.xz" -o /tmp/zig.tar.xz
            tar -C "$HOME/.local" -xf /tmp/zig.tar.xz
            mv "$HOME/.local/zig-$ZA-$VER" "$ZD"
          fi
          echo "$ZD" >> "$GITHUB_PATH"
          # GITHUB_PATH 对当前步骤不生效：同步骤用绝对路径验证
          "$ZD/zig" version

      - name: Install Zig 0.17 (EraAudio kernel, windows-msvc)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '0.17.0'
          $zd = Join-Path $env:LOCALAPPDATA "zig-$ver"
          if (!(Test-Path (Join-Path $zd 'zig.exe'))) {
            $zip = Join-Path $env:TEMP "zig.zip"
            Invoke-WebRequest -Uri "https://ziglang.org/download/$ver/zig-x86_64-windows-$ver.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $env:LOCALAPPDATA -Force
            Move-Item (Join-Path $env:LOCALAPPDATA "zig-x86_64-windows-$ver") $zd -Force
          }
          Add-Content $env:GITHUB_PATH $zd
          & (Join-Path $zd 'zig.exe') version

      # ─────────── macOS：自建纯 LGPL 最小 FFmpeg（自包含 + 许可证）───────────
      # 不用 brew 的 ffmpeg（GPL），改为自建；见 build-ffmpeg-minimal.sh。
      - name: Cache minimal FFmpeg (macOS)
        if: matrix.os == 'macos'
        id: ffmpeg-cache-macos
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/ffmpeg-minimal
          # tls 段：自包含 mbedTLS 引入后旧缓存（无 .mbedtls-tls 标记）必须失效重建。
          key: ffmpeg-minimal-9.0.1-tls-${{ runner.os }}-${{ matrix.arch }}

      - name: Build minimal FFmpeg (macOS, LGPL)
        if: matrix.os == 'macos' && steps.ffmpeg-cache-macos.outputs.cache-hit != 'true'
        run: bash app/core/build-ffmpeg-minimal.sh

      - name: Point build at minimal FFmpeg (macOS)
        if: matrix.os == 'macos'
        run: |
          PREFIX="$HOME/.local/ffmpeg-minimal"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$PREFIX/lib" >> "$GITHUB_ENV"

      # ──────────────────── 原生模块编译（各自一站式入口）──────────────
      - name: Build native modules (macOS 一站式脚本)
        if: matrix.os == 'macos'
        # 统一入口 app/core/build-macos.sh，收敛 audio-engine / scraper /
        # scanner / indexer / vault / subsonic 全部原生模块编译：
        # 本地开发与 CI 共用同一入口，逻辑改动只落一处（对齐 build_windows.bat）。
        # 依赖由上方步骤提前安装，脚本只做编译引导；matrix.rid 决定单架构。
        run: bash app/core/build-macos.sh "${{ matrix.rid }}"

      - name: Build native modules (Windows bat 一站式引导)
        if: matrix.os == 'windows'
        shell: cmd
        # 统一入口 app/core/build_windows.bat，在单个 cmd 会话内完成全部模块：
        #   vswhere→vcvars64（MSVC 环境）→ audio-engine（cargo tempo + cl 直编
        #   archoera_mediaengine.dll）→ scraper（CMake+vcpkg toolchain）
        #   → scanner（dotnet publish）→ indexer（dotnet publish）→ subsonic（go+rust）
        #   → vault-rs（cargo 静态单文件）。
        # 依赖由上方步骤提前安装（vcpkg headers 缺失时 bat 内自动 install 兜底），
        # 脚本只做编译引导。与 build-linux.sh / build-macos.sh 同构，本地开发
        # 与 CI 共用同一入口，逻辑改动只落一处。
        env:
          VCPKG_TARGET_TRIPLET: x64-windows-release
          # 可选原生 Toast：build_windows.bat 检测该目录含 winrt 头时才启用
          CPPWINRT_INCLUDE: C:\vcpkg\installed\x64-windows-release\include
        working-directory: app/core
        # 输出重定向到文件、只回显尾部（同 vcpkg：避免海量 `\r` 进度行卡死网页
        # 日志查看器）；完整日志经下方 artifact 上传，失败时 tail 可见。
        run: |
          call build_windows.bat > build_windows.log 2>&1
          set RC=%ERRORLEVEL%
          echo "==== build_windows.log (tail 150) ===="
          powershell -NoProfile -Command "Get-Content -Tail 150 build_windows.log"
          if not "%RC%"=="0" (echo "::error::build_windows.bat 失败 rc=%RC%" & exit /b %RC%)

      - name: Upload Windows build logs (排查用)
        if: matrix.os == 'windows' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-build-logs
          path: |
            app/vcpkg-install.log
            app/core/build_windows.log
          if-no-files-found: ignore

      # ───────────── Flutter pub get / analyze（统一在 app/）─────────────
      - name: Flutter pub get
        working-directory: app
        # --enforce-lockfile：lockfile 与解析结果不一致时立即失败（否则 pub 会
        # 静默重新解析，把 nativeapi 升到需要更新 Dart 的 0.5.10，见 build-release.sh）。
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        working-directory: app
        run: dart analyze lib

      # ──────────────────────── Flutter 端构建（分平台）─────────────────
      - name: Build Flutter macOS
        if: matrix.os == 'macos'
        working-directory: app
        # 工程 Release 配置已用 ad-hoc 签名（CODE_SIGN_IDENTITY = "-"），CI 无需证书；
        # 现行 Flutter 的 build macos 不再支持 --no-codesign，去掉即可。
        # FLUTTER_XCODE_ARCHS 会被 Flutter 透传为 xcodebuild 的 ARCHS（见
        # flutter_tools 的 FLUTTER_XCODE_ 前缀约定），从而让主二进制、Flutter
        # framework 与 archoerashell 都只保留 matrix.arch 一个 slice；否则
        # Release 默认 universal，会和 native/ 的单架构 FFI 库错配。
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.arch }}
        run: flutter build macos --release

      - name: Build Flutter Windows
        if: matrix.os == 'windows'
        working-directory: app
        # platform bridge（MSVC C++）经 CMake 内嵌构建，WinRT(SMTC/Toast) 需
        # cppwinrt 头；缺头时 backend_windows.cpp 自动降级（SMTC 禁用）。
        env:
          CPPWINRT_INCLUDE: C:\vcpkg\installed\x64-windows-release\include
        shell: pwsh
        run: flutter build windows --release

      # ─────────── Windows：装配 + 校验 + 打包（单脚本）───────────
      # 逻辑全部在 packaging/windows/build-release.ps1（**Windows 专用**）：
      #   bundle  : 放入防伪公钥（native/ 由 CMake install 填充）
      #   verify  : 必需文件齐全 + 完整性清单覆盖 + dumpbin 导入表无构建机路径
      #   package : 便携 zip + Inno Setup 安装器（默认 per-user 免 UAC）
      - name: Install Inno Setup (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows release (bundle + verify + package)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File packaging/windows/build-release.ps1 all
          Get-ChildItem build/windows-extra

      # ─────────────── macOS：装配 .app + 依赖守卫 + 打包 ──────────────
      # 全部逻辑收敛在 packaging/macos/build-release.sh（**macOS 专用**，只在
      # Mac 上跑，只用 macOS 自带工具），workflow 只负责调用，避免内联 bash
      # 片段与 Linux 脚本混在一起、也避免 macOS 自带 bash 3.2 的语法差异。
      #   bundle  : 拷入 native/、dylibbundler 收拢 FFmpeg/TagLib、install_name
      #             归一化、许可文本、公钥、ad-hoc 重签、生成完整性清单
      #   verify  : Mach-O 依赖守卫 + dyld 实际 dlopen 全部 FFI 库 + archoerashell
      #   package : DMG（拖拽安装）+ zip（ditto）
      - name: Build macOS release (bundle + verify + package)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/macos/build-release.sh all --arch "${{ matrix.arch }}"
          ls -la dist/macos

      - name: Upload artifact (macOS DMG + zip)
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraMusic-${{ matrix.artifact }}
          path: dist/macos/*
          if-no-files-found: error

      - name: Upload artifact (Windows runner Release)
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraMusic-windows-x64
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error

      - name: Upload artifact (Windows installer + portable)
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraMusic-windows-extra
          path: build/windows-extra/*
          if-no-files-found: error

  # =====================================================================
  #  Linux 按发行版分开构建：每个发行版在自己的容器内从源码编译，链接并使用
  #  该发行版自身的 FFmpeg / TagLib。原因：二者 soname 跨发行版会 bump
  #  （libavformat.so.60→.63、libtag.so.1→.2），在 Ubuntu 上构建再重打包到
  #  Arch 会因 soname 不匹配而加载失败（引擎与 scraper 均实测失败）。
  #  公共构建逻辑收敛在 .github/actions/build-linux（复合 action）。
  # =====================================================================

  # ── Debian/Ubuntu：.deb + tar.gz（并上传原始 bundle 供 AppImage/Flatpak/Nix）──
  linux-deb:
    name: Linux deb (Ubuntu 24.04)
    needs: preflight
    if: needs.preflight.outputs.linux_deb == 'true'
    runs-on: ubuntu-24.04
    env:
      BUILD_BASE: ubuntu-24.04
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # 不装系统 FFmpeg 开发包：引擎改用自建最小 FFmpeg（见 build-linux action）
          sudo apt-get install -y \
            build-essential ninja-build pkg-config clang \
            libsqlite3-dev libtag1-dev \
            nlohmann-json3-dev libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libdbus-1-dev libx11-dev libxi-dev libopus-dev \
            patchelf nasm xvfb xauth libgl1-mesa-dri dbus
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/build-linux
        with:
          cache_key_suffix: ubuntu2404
      - name: Resolve version (from pubspec.yaml)
        id: version
        run: |
          VER="$(grep '^version:' app/pubspec.yaml | awk '{print $2}')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${VER}"
      - name: Package tar.gz (纯二进制)
        run: bash packaging/linux/package.sh tar app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
        env:
          DISTRO_TAG: linux
      - name: Package .deb (Ubuntu 24.04)
        run: bash packaging/linux/package.sh deb app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
        env:
          DISTRO_TAG: ubuntu24.04
      - name: Upload bundle artifact (原始 bundle)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraMusic-linux-x64
          path: app/build/linux/x64/release/bundle
          if-no-files-found: error
      - name: Upload packages artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraMusic-linux-deb
          path: dist/linux/*
          if-no-files-found: error

  # ── Deepin：单独开包（老基线 glibc）────────────────────────────────────
  # Deepin 基于 Debian，系统库较旧：Ubuntu 24.04 产物（glibc 2.39）在 Deepin 上
  # 起不来。此 job 在**最老的可行基线**（Ubuntu 20.04 / glibc 2.31，即 Flutter
  # 要求的地板）上从源码构建，产出单独的 .deb（DISTRO_TAG=deepin）。若仍无法在
  # Deepin 运行且不可解决，则放弃该 job 与 Deepin 支持。
  linux-deepin:
    name: Linux deb (Deepin 25)
    needs: preflight
    if: needs.preflight.outputs.linux_deepin == 'true'
    runs-on: ubuntu-24.04
    # 在官方 Deepin 25 容器内构建（linuxdeepin/deepin:25，merged-/usr，glibc 2.38）。
    # 注意：Deepin 的 beige(23)/crimson(25) 仓库现在都发 glibc 2.38，故本产物
    # 最低 glibc=2.38，**仅适用 Deepin 25 及更新系统**——文件名/包描述/BUILD-INFO
    # 均明确标注。旧 Deepin 23（glibc 2.35）需另用低基线（如 debian:11）构建。
    container: linuxdeepin/deepin:25
    env:
      BUILD_BASE: deepin-25
    steps:
      - name: Install system dependencies
        run: |
          # 该镜像未预置 apt 源；指向 Deepin 25(crimson) 仓库后安装构建依赖。
          echo "deb https://community-packages.deepin.com/beige/ crimson main commercial community" > /etc/apt/sources.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates build-essential cmake ninja-build pkg-config clang sudo \
            libsqlite3-dev libtag1-dev \
            nlohmann-json3-dev libgtk-3-dev liblzma-dev libopus-dev \
            libdbus-1-dev libx11-dev libxi-dev \
            patchelf nasm xvfb xauth libgl1-mesa-dri dbus \
            git curl wget xz-utils unzip zip jq file
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Git safe directory (容器属主)
        run: git config --global --add safe.directory '*'
      - uses: ./.github/actions/build-linux
        with:
          cache_key_suffix: deepin25
      - name: Resolve version (from pubspec.yaml)
        id: version
        run: |
          VER="$(grep '^version:' app/pubspec.yaml | awk '{print $2}')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${VER}"
      - name: Package .deb (Deepin 25)
        run: bash packaging/linux/package.sh deb app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
        env:
          DISTRO_TAG: deepin25
          DISTRO_NOTE: 仅 Deepin 25（glibc 2.38）；其它发行版请安装对应包
      - name: Upload packages artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraMusic-linux-deepin
          path: dist/linux/*
          if-no-files-found: error

  # ── Fedora/RHEL：.rpm（fedora 容器内从源码构建）───────────────────────
  linux-rpm:
    name: Linux rpm (Fedora)
    needs: preflight
    if: needs.preflight.outputs.linux_rpm == 'true'
    runs-on: ubuntu-24.04
    # 固定 Fedora 43（OpenSSL 3.5）：fedora:latest 已升到 OpenSSL 4.x，
    # .NET 10 NativeAOT 目前不识别 4.x，会报 "No usable version of libssl was found"。
    container: fedora:43
    env:
      BUILD_BASE: fedora
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git curl wget tar xz which findutils gzip unzip zip jq file \
            gcc gcc-c++ clang cmake ninja-build pkgconf-pkg-config make \
            patchelf nasm \
            taglib-devel sqlite-devel \
            json-devel gtk3-devel dbus-devel libstdc++-devel libicu \
            opus-devel libX11-devel libXi-devel \
            xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers dbus-daemon \
            rpm-build zstd libarchive
          # 不装系统 FFmpeg 开发包：引擎改用自建最小 FFmpeg（见 build-linux action）
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Git safe directory (容器属主)
        run: git config --global --add safe.directory '*'
      - uses: ./.github/actions/build-linux
        with:
          cache_key_suffix: fedora
      - name: Resolve version (from pubspec.yaml)
        id: version
        run: |
          VER="$(grep '^version:' app/pubspec.yaml | awk '{print $2}')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${VER}"
      - name: Package .rpm (Fedora/RHEL/openSUSE)
        run: bash packaging/linux/package.sh rpm app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
        env:
          DISTRO_TAG: fedora
      - name: Upload packages artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraMusic-linux-rpm
          path: dist/linux/*
          if-no-files-found: error

  # ── Arch Linux：.pkg.tar.zst（archlinux 容器内从源码构建）─────────────
  linux-arch:
    name: Linux pkg.tar.zst (Arch)
    needs: preflight
    if: needs.preflight.outputs.linux_arch == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      BUILD_BASE: archlinux
    steps:
      - name: Install system dependencies
        run: |
          # makepkg 需要：awk bsdtar(libarchive) bzip2 coreutils fakeroot file
          # find(findutils) gettext gpg grep gzip sed tput(ncurses) xz —— 显式列全
          pacman -Sy --noconfirm --needed \
            base-devel fakeroot debugedit bzip2 gettext gnupg ncurses \
            git curl wget tar xz which findutils unzip zip jq file zstd libarchive \
            cmake ninja clang pkgconf patchelf nasm \
            taglib sqlite nlohmann-json opus \
            gtk3 dbus libx11 libxi xorg-server-xvfb xorg-xauth mesa
          # 不装系统 ffmpeg：引擎改用自建最小 FFmpeg（见 build-linux action）
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Git safe directory (容器属主)
        run: git config --global --add safe.directory '*'
      - uses: ./.github/actions/build-linux
        with:
          cache_key_suffix: arch
      - name: Resolve version (from pubspec.yaml)
        id: version
        run: |
          VER="$(grep '^version:' app/pubspec.yaml | awk '{print $2}')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${VER}"
      - name: Package Arch pkg.tar.zst (makepkg as nobody)
        env:
          DISTRO_TAG: arch
        run: |
          bash packaging/linux/package.sh arch app/build/linux/x64/release/bundle "${{ steps.version.outputs.version }}"
          # makepkg 拒绝 root 运行；nobody 需先解除镜像预设的账户过期
          chown -R nobody:nobody packaging/linux/work/arch
          chage -E -1 nobody
          su nobody -s /bin/bash -c \
            'cd packaging/linux/work/arch && HOME=/tmp makepkg -f --skipinteg --nocheck --nodeps'
          # 统一命名为显著标识发行版的文件名（pkg 内部元数据不变）
          cp packaging/linux/work/arch/*.pkg.tar.zst \
            "dist/linux/ArchoeraMusic-v${{ steps.version.outputs.version }}-arch-x86_64.pkg.tar.zst"
          echo "→ dist/linux/"*.pkg.tar.zst
      - name: Upload packages artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraMusic-linux-arch
          path: dist/linux/*
          if-no-files-found: error

  # ── AppImage：消费 linux-deb 的原始 bundle，linuxdeploy 收拢依赖后装配 ──
  # 与发行版包分开：AppImage 需在「构建机同系」环境用 linuxdeploy 把 GTK /
  # FFmpeg / TagLib 等动态依赖收进镜像并改写 RUNPATH，才能跨发行版运行。
  linux-appimage:
    name: Linux AppImage (通用)
    needs: [preflight, linux-deb]
    if: needs.preflight.outputs.linux_appimage == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Resolve version (from pubspec.yaml)
        id: version
        run: |
          VER="$(grep '^version:' app/pubspec.yaml | awk '{print $2}')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${VER}"
      - name: Download bundle artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ArchoeraMusic-linux-x64
          path: bundle
      - name: Install AppImage tooling
        run: |
          sudo apt-get update
          # linuxdeploy 按 ldd 解析并收拢 app 的动态依赖：GTK / X11 / Xi / dbus /
          # sqlite / taglib 等运行时库必须存在，否则报
          # "Could not find dependency: libXXX.so.N" 直接失败；patchelf 供其改写 RUNPATH。
          # scraper 的 HTTP 已内嵌（reqwest + rustls），libcurl/libssl 不再参与。
          # binutils：package.sh 的 BUILD-INFO 用 objdump 探测最低 glibc。
          sudo apt-get install -y binutils file patchelf \
            libgtk-3-dev libx11-dev libxi-dev libdbus-1-dev \
            libsqlite3-dev libtag1-dev \
            xvfb xauth libgl1-mesa-dri dbus
          # GitHub Release 资产偶发 504：官方失败时走镜像；下载后校验确实是 ELF。
          fetch_asset() {
            local url="$1" out="$2" prefix
            for prefix in "" \
              "https://ghproxy.net/" \
              "https://gh-proxy.com/" \
              "https://ghfast.top/" \
              "https://gh.moeyy.xyz/" \
              "https://ghproxy.cc/" \
              "https://gh.llkk.cc/"; do
              if wget -q --timeout=90 --tries=2 -O "$out" "${prefix}${url}" \
                 && [ -s "$out" ] && file "$out" | grep -q 'ELF'; then
                return 0
              fi
            done
            return 1
          }
          # appimagetool（CI 无 FUSE，运行时用 --appimage-extract-and-run）
          fetch_asset https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          sudo mv /tmp/appimagetool.AppImage /usr/local/bin/appimagetool
          # type2 runtime 预下载（appimagetool 打包时不再联网下载，规避网络抖动）
          fetch_asset https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 /tmp/type2-runtime
          # linuxdeploy：AppImage 装配时收拢 GTK/FFmpeg/TagLib 等动态依赖
          fetch_asset https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage /tmp/linuxdeploy.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
      - name: Restore executable bits (artifact 上传丢失权限)
        # upload-artifact@v4 不保留权限（文件统一 644）：解包后按 ELF 可执行文件
        # 恢复 +x，否则产物内主程序 archoera_music 与引擎/保险库子进程无法执行。
        run: |
          find bundle -type f -exec file {} + \
            | grep -i 'ELF.*executable' | cut -d: -f1 | xargs -r chmod +x
      - name: Package AppImage (通用)
        run: bash packaging/linux/package.sh appimage "$PWD/bundle" "${{ steps.version.outputs.version }}"
        env:
          DISTRO_TAG: linux
          APPIMAGE_RUNTIME_FILE: /tmp/type2-runtime
          LINUXDEPLOY: /tmp/linuxdeploy.AppImage
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Startup smoke test (AppImage, Xvfb)
        # 直接跑最终 AppImage（--appimage-extract-and-run，无需 FUSE），覆盖
        # linuxdeploy 收拢依赖 + AppRun 环境后的真实用户路径。
        run: |
          set -euo pipefail
          APPIMAGE="$(find dist/linux -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          [ -n "$APPIMAGE" ] || { echo "::error::未找到 AppImage 产物"; exit 1; }
          # 复用 Linux 平台脚本的启动冒烟逻辑（解包后运行，无需 FUSE）
          bash packaging/linux/build-release.sh smoke-appimage --appimage "$APPIMAGE"
      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraMusic-linux-appimage
          path: dist/linux/*.AppImage
          if-no-files-found: error

  # ── Flatpak：消费 linux-deb 的原始 bundle（包装预构建方式，无需 flatpak-builder）──
  linux-flatpak:
    name: Linux Flatpak (通用)
    needs: [preflight, linux-deb]
    if: needs.preflight.outputs.linux_flatpak == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Resolve version (from pubspec.yaml)
        id: version
        run: |
          VER="$(grep '^version:' app/pubspec.yaml | awk '{print $2}')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${VER}"
      - name: Download bundle artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ArchoeraMusic-linux-x64
          path: bundle
      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak file
      - name: Restore executable bits (artifact 上传丢失权限)
        # upload-artifact@v4 不保留权限（文件统一 644）：解包后按 ELF 可执行文件
        # 恢复 +x，否则 Flatpak 内主程序与引擎子进程无法执行。
        run: |
          find bundle -type f -exec file {} + \
            | grep -i 'ELF.*executable' | cut -d: -f1 | xargs -r chmod +x
      - name: Package Flatpak (通用)
        run: bash packaging/linux/package-flatpak.sh "$PWD/bundle" "${{ steps.version.outputs.version }}"
        env:
          DISTRO_TAG: flatpak
      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraMusic-linux-flatpak
          path: dist/linux/*.flatpak
          if-no-files-found: error

  # ── NixOS：独立源构建 flake（nixpkgs 工具链，脱离 Ubuntu 预构建 bundle）──
  # 用仓库根 flake.nix 从源码编译 FFmpeg(自建最小纯 LGPL·仅音频) + 全部原生
  # 模块 + Flutter；产物为纯 Nix store 依赖，不依赖宿主发行版（真正脱离 Ubuntu）。
  # 构建需联网（pub / NuGet / crates.io / go modules / FFmpeg 源码），故关沙箱。
  linux-nix:
    name: Linux NixOS (source flake)
    needs: preflight
    if: needs.preflight.outputs.linux_nix == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
        with:
          extra-conf: |
            sandbox = false
            substituters = https://cache.nixos.org
      - name: Resolve version (from pubspec.yaml)
        id: version
        run: |
          VER="$(grep '^version:' app/pubspec.yaml | awk '{print $2}')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${VER}"
      - name: Build NixOS (source flake)
        run: nix build .#default --option sandbox false --print-build-logs
      - name: Package result
        run: |
          mkdir -p dist/linux
          tar -czf "dist/linux/ArchoeraMusic-v${{ steps.version.outputs.version }}-nixos-x86_64.tar.gz" -C result .
          ls -la dist/linux/*nixos*.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchoeraMusic-linux-nix
          path: dist/linux/*nixos*.tar.gz
          if-no-files-found: error

  # =====================================================================
  #  release：仅 push tag v* 触发，汇总全部平台 artifact 发布 GitHub Release。
  #  needs 保证所有平台全部构建成功才发版（任一端失败 → 不发版）。
  #  方案选 gh CLI（ubuntu runner 预装，免引第三方 action，且可按 assets/*
  #  精确控制多文件上传；软props/action-gh-release@v2 对目录型产物
  #  （macOS .app / Windows Release 目录）需要逐个 glob，不便聚合成单 asset）。
  #  tag 名即版本（仓库现有 v* 标签原样使用）；同名 release 已存在时
  #  （如手动重跑同一 tag）退化为补传/覆盖资产，幂等。
  # =====================================================================
  release:
    name: Release ${{ github.ref_name }}
    needs: [preflight, build, linux-deb, linux-rpm, linux-arch, linux-deepin, linux-appimage, linux-flatpak, linux-nix]
    # 仅 push tag v*；且「点菜」必须九项全选（未全选绝不放行 release）。
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.preflight.outputs.all_selected == 'true'
    runs-on: ubuntu-latest
    # 受保护 Environment：需 Required reviewers 手动批准后才运行；
    # 两把签名私钥作为 Environment secret 存放（仅本作业可见，非仓库级缓存）。
    environment: release
    permissions:
      contents: write
      actions: read
      # SEC-25：供 attest-build-provenance 的 OIDC 令牌与 attestation 写入
      id-token: write
      attestations: write
    steps:
      - name: Checkout (签名工具 + 公钥)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # SEC-23：拒绝「tag 指向未评审提交」。发版 tag 必须指向受保护长分支
      # （main 或 ArchoeraOS）的祖先提交，否则不放行构建/签名。用 gh api compare
      # 判定，无需完整 git 历史（浅克隆即可）。
      - name: 校验发版 tag 指向受保护分支（SEC-23）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ok=0
          for base in main ArchoeraOS; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/${base}...${GITHUB_SHA}" \
              --jq .status 2>/dev/null || echo error)
            echo "compare ${base}...${GITHUB_SHA} => ${status}"
            case "$status" in
              behind|identical) echo "OK：tag 指向 ${base} 的祖先提交"; ok=1; break ;;
            esac
          done
          if [ "$ok" != 1 ]; then
            echo "::error::发版 tag 未指向 main/ArchoeraOS 的已合并提交，拒绝构建/签名（SEC-23）"
            exit 1
          fi

      - name: Download all platform build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      # SEC-08：在目录被压缩成 assets/*.tar.gz 之前，对已打包 native/ 的
      # ARCHOERA-NATIVE-MANIFEST.txt 做 key1 分离签名（<manifest>.sig1），
      # 运行期 NativeIntegrity 用二进制内嵌公钥验签（防「换库+重算摘要」）。
      # 注：Inno Setup .exe 与已构建的发行版安装包（deb/rpm/AppImage/flatpak/
      # pkg.tar.zst/nixos）**不在此重签**——它们各自依赖包管理器签名 / 外层
      # .sig1 校验；此处只覆盖会被运行期清单校验读取的目录型产物与便携 zip。
      - name: 签名原生完整性清单（SEC-08）
        shell: bash
        env:
          ARCHOERA_WM_KEY1_PEM: ${{ secrets.ARCHOERA_WM_KEY1_PEM }}
        run: |
          set -euo pipefail
          if [ -z "${ARCHOERA_WM_KEY1_PEM:-}" ]; then
            echo "未配置 ARCHOERA_WM_KEY1_PEM，跳过原生清单签名（不影响出包）"
            exit 0
          fi
          sign_dir() {
            if [ -d "$1" ]; then
              bash app/tool/sign_native_manifest.sh "$1"
            else
              echo "跳过（目录不存在）：$1"
            fi
          }
          for a in arm64 x64; do
            sign_dir "artifacts/ArchoeraMusic-macos-$a/archoera_music.app/Contents/native"
          done
          sign_dir artifacts/ArchoeraMusic-windows-x64/native
          sign_dir artifacts/ArchoeraMusic-linux-x64/native
          # Windows 便携 zip：解压 → 签名其中清单 → 原地同文件名重压。
          for z in artifacts/ArchoeraMusic-windows-extra/*.zip; do
            [ -f "$z" ] || continue
            tmp="$(mktemp -d)"
            unzip -q "$z" -d "$tmp"
            d="$(dirname "$(find "$tmp" -name ARCHOERA-NATIVE-MANIFEST.txt -print -quit)")"
            if [ -f "$d/ARCHOERA-NATIVE-MANIFEST.txt" ]; then
              bash app/tool/sign_native_manifest.sh "$d"
              zabs="$(readlink -f "$z")"
              rm -f "$zabs"
              (cd "$tmp" && zip -q -r "$zabs" .)
              echo "→ 重签 $z"
            else
              echo "跳过（zip 内无清单）：$z"
            fi
            rm -rf "$tmp"
          done
          echo "── 原生清单签名完成 ──"

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          test -d artifacts/ArchoeraMusic-linux-x64       # Linux 原始 bundle (Ubuntu)
          test -d artifacts/ArchoeraMusic-linux-deb       # Linux deb 包集 (Ubuntu)
          test -d artifacts/ArchoeraMusic-linux-deepin    # Linux deb 包集 (Deepin)
          test -d artifacts/ArchoeraMusic-linux-rpm       # Linux rpm 包集
          test -d artifacts/ArchoeraMusic-linux-arch      # Linux pkg.tar.zst
          test -d artifacts/ArchoeraMusic-linux-appimage  # Linux AppImage
          test -d artifacts/ArchoeraMusic-linux-flatpak   # Linux .flatpak
          test -d artifacts/ArchoeraMusic-linux-nix       # Linux NixOS tar.gz
          test -d artifacts/ArchoeraMusic-macos-arm64     # macOS arm64 DMG + zip
          test -d artifacts/ArchoeraMusic-macos-x64       # macOS x86_64 DMG + zip
          test -d artifacts/ArchoeraMusic-windows-x64     # Windows runner Release
          test -d artifacts/ArchoeraMusic-windows-extra   # Windows installer + portable
          mkdir -p assets
          # Linux：各发行版安装包直接作为独立 asset（tar.gz/deb/AppImage/flatpak/
          # nixos/rpm/pkg.tar.zst 均已带版本号，名称不冲突）
          cp artifacts/ArchoeraMusic-linux-deb/* assets/
          cp artifacts/ArchoeraMusic-linux-deepin/* assets/
          cp artifacts/ArchoeraMusic-linux-rpm/* assets/
          cp artifacts/ArchoeraMusic-linux-arch/* assets/
          cp artifacts/ArchoeraMusic-linux-appimage/* assets/
          cp artifacts/ArchoeraMusic-linux-flatpak/* assets/
          cp artifacts/ArchoeraMusic-linux-nix/* assets/
          # Windows：Inno Setup 安装器与便携 zip 直接作为独立 asset
          cp artifacts/ArchoeraMusic-windows-extra/* assets/
          # upload-artifact@v4 打包会丢失可执行位：下载后按 Mach-O/ELF magic
          # 恢复 +x（否则 .app/Contents/MacOS 主二进制与 native/ 子进程解包后无法运行）
          while IFS=: read -r fp _; do
            chmod +x "$fp"
          done < <(find artifacts -type f -exec file {} + | grep -i 'ELF\|Mach-O')
          # macOS：DMG + zip 已由 packaging/macos/build-release.sh 产出（DMG 可直接
          # 拖入「应用程序」，zip 便于不支持挂载的环境），直接作为独立 asset。
          cp artifacts/ArchoeraMusic-macos-arm64/* assets/
          cp artifacts/ArchoeraMusic-macos-x64/* assets/
          # Windows 目录型产物压成单文件归档（tar 三端可解）
          tar -czf "assets/ArchoeraMusic-${VER}-windows-x64.tar.gz" \
            -C artifacts/ArchoeraMusic-windows-x64 .
          # Linux 原始 bundle 与 package.sh tar 纯二进制内容一致，不再重复出包
          echo "── release assets ──"
          ls -la assets

      # SEC-25：生成 CycloneDX SBOM（随发布分发，供用户/下游核对依赖）。
      # 覆盖范围：发布产物（FFmpeg / OpenSSL / opus / taglib 等原生库、自家
      # 二进制、Go 模块）+ 各生态锁文件（Rust 各 crate Cargo.lock、Dart pubspec.lock、
      # Go go.mod+go.sum、.NET scanner/indexer 的 packages.lock.json）。
      # 只扫产物目录时 syft 读不到锁文件 → Rust / .NET / Dart 覆盖为 0（旧实现）。
      - name: 安装 syft（SBOM 生成器，pin 版本 + sha256 校验）
        shell: bash
        env:
          SYFT_VERSION: v1.54.1
        run: |
          set -euo pipefail
          V="${SYFT_VERSION#v}"
          base="https://github.com/anchore/syft/releases/download/${SYFT_VERSION}"
          curl -sSfL -o "/tmp/syft_${V}_linux_amd64.tar.gz" \
            "${base}/syft_${V}_linux_amd64.tar.gz"
          curl -sSfL -o /tmp/syft_checksums.txt "${base}/syft_${V}_checksums.txt"
          (cd /tmp && grep " syft_${V}_linux_amd64.tar.gz$" syft_checksums.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -C "$RUNNER_TEMP/bin" -xzf "/tmp/syft_${V}_linux_amd64.tar.gz" syft
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/syft" version

      - name: 生成 SBOM（CycloneDX）
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          bash app/tool/gen_sbom.sh artifacts . "$VER" assets/ARCHOERA-SBOM.cdx.json

      # 发布签名 —— CI 用 key1 签 `.sig1`：私钥来自受保护 `release` Environment
      # （需人工批准），Windows runner 不参与。公钥随发布分发。未配置则不签、不阻断。
      - name: 签名发布资产（key1 → .sig1）
        shell: bash
        env:
          ARCHOERA_WM_KEY1_PEM: ${{ secrets.ARCHOERA_WM_KEY1_PEM }}
        run: |
          set -euo pipefail
          cp app/tool/watermark_pub.pem assets/ARCHOERA_PUBKEY.pem
          if [ -n "${ARCHOERA_WM_KEY1_PEM:-}" ]; then
            bash app/tool/sign_release.sh assets
          else
            echo "未配置 ARCHOERA_WM_KEY1_PEM，跳过签名（不影响出包）"
          fi
          echo "── final assets ──"
          ls -la assets

      # SEC-25：为最终发布字节写入构建溯源 attestation（Sigstore/OIDC）。
      # 注：完整的「每个构建作业自带溯源 + macOS 公证 / Windows Authenticode
      # 代码签名」仍为待办（见 docs/supply-chain.md）。
      - name: 生成构建溯源 attestation（SEC-25）
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'assets/*'

      - name: Create GitHub Release (tag v*)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # SEC-24：tag 名经环境变量注入，**绝不**用 ${{ github.ref_name }} 内插进
          # shell（git 允许含 shell 元字符的 tag 名 → 命令注入）。
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"

          # 从 CHANGELOG.md 抽取本 tag 对应段落作为 Release 正文
          # （标题形如 `## [0.9.15+8] - 2026-09-12`）。用 index() 字面匹配，
          # 避免版本号里的 `+` 被当正则量词；抽到下一个 `## [` 为止。
          NOTES=release_notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VER" '
              /^## \[/ { if (in_sec) exit; if (index($0, "[" ver "]") > 0) { in_sec=1; next } }
              in_sec { print }
            ' CHANGELOG.md > "$NOTES"
          fi

          if [ -s "$NOTES" ]; then
            echo "── Release 正文（来自 CHANGELOG.md，$VER）──"
            cat "$NOTES"
          else
            echo "CHANGELOG.md 未找到 $VER 段落，回退通用文案"
            printf '三端 matrix 构建产物：Linux 多发行版安装包 / macOS arm64 + x86_64 / Windows x64。\n' > "$NOTES"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明 + 补传/覆盖资产（幂等重跑）"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
            gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "ArchoeraMusic ${VER}" \
              --notes-file "$NOTES"
          fi
