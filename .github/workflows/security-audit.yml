# SEC-26：依赖漏洞扫描（各生态 audit）。
# 与 Dependabot（.github/dependabot.yml，负责版本更新 / 安全告警）互补：
# 本工作流在固定节奏上主动跑各生态的漏洞扫描，PR/合并到 main 时也跑一次。
# 全部 GitHub Actions 依赖固定到 commit SHA（SEC-21）。
name: Dependency audit

on:
  schedule:
    # 每周一 03:17 UTC（错峰）
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main, ArchoeraOS]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    # audit-check 需 checks: write 才能发布 check run；对新披露漏洞会开 issue
    # 跟踪故需 issues: write；fork PR 时 token 自动降为只读，此时仅校验/判失败。
    permissions:
      contents: read
      checks: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        dir:
          - app/core/downloader
          - app/core/shell
          - app/core/subsonic/transcoder
          - app/core/audio-engine/tempo-rs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.dir }}
          # RUSTSEC-2023-0071（rsa Marvin 计时侧信道）仅影响**持有私钥**的一方；
          # downloader 只用 `RsaPublicKey::encrypt`（酷狗登录公钥加密，见 src/crypto.rs），
          # 不持私钥、不做解密，故该项不适用。待上游出补丁后再评估升级。
          ignore: RUSTSEC-2023-0071

  govulncheck:
    name: govulncheck (subsonic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: '1.26'
          work-dir: app/core/subsonic
          cache-dependency-path: app/core/subsonic/go.sum
          repo-checkout: false

  dotnet-audit:
    name: dotnet vulnerable packages (scanner / indexer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: dotnet list package --vulnerable
        shell: bash
        run: |
          set -euo pipefail
          # scanner / indexer 同 NuGet 栈（Microsoft.Data.Sqlite + SQLitePCLRaw，
          # 同 CVE-2025-6965 pin），二者一并审计。
          for proj in app/core/scanner/scanner.csproj app/core/indexer/indexer.csproj; do
            echo "== $proj =="
            dotnet list "$proj" package --vulnerable --include-transitive
          done

  # Workflow 语法检查：workflow 文件写错时 GitHub 只会给 startup_failure（状态
  # 页一个红叉 + 邮件），本地没有任何拦截。这里在 PR 上直接 lint 全部 workflow，
  # 顺带 `bash -n` / `py_compile` 一遍工具脚本（发布脚本改错同样只会在 tag 时炸）。
  workflow-lint:
    name: Workflow syntax (actionlint) + script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: 安装 actionlint（pin 版本 + sha256 校验）
        shell: bash
        env:
          # 升级时同步改版本号（下载按官方 *_checksums.txt 校验，防截断/篡改）。
          ACTIONLINT_VERSION: v1.7.12
        run: |
          set -euo pipefail
          V="${ACTIONLINT_VERSION#v}"
          base="https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}"
          curl -sSfL -o /tmp/actionlint.tar.gz "${base}/actionlint_${V}_linux_amd64.tar.gz"
          curl -sSfL -o /tmp/actionlint_checksums.txt "${base}/actionlint_${V}_checksums.txt"
          (cd /tmp && grep " actionlint_${V}_linux_amd64.tar.gz$" actionlint_checksums.txt | sha256sum -c -)
          tar -C /tmp -xzf /tmp/actionlint.tar.gz actionlint
          /tmp/actionlint -version
      - name: Lint 全部 workflow（YAML / 表达式 / uses 输入 / needs 图 / 注入）
        shell: bash
        run: |
          set -euo pipefail
          /tmp/actionlint .github/workflows/*.yml
      - name: 脚本语法（bash -n / py_compile）
        shell: bash
        run: |
          set -euo pipefail
          for f in app/tool/*.sh app/core/*/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done
          python3 -m py_compile app/tool/*.py
