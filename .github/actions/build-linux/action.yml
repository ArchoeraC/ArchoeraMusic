name: Build ArchoeraMusic (Linux)
description: >-
  各发行版共用的 Linux 构建：安装工具链（Rust/Go/.NET/Flutter/Zig）→
  编译全部原生模块 → Zig 内核回归 + archoerashell Rust 单测 → Flutter analyze/test
  → flutter build linux。
  发行版专属的系统依赖安装与打包步骤由调用方 job 负责（复合 action 在调用方
  job 的容器/runner 内执行，因此天然复用各发行版的本地库）。
inputs:
  zig_archive:
    description: Zig 官方归档后缀（如 x86_64-linux）
    required: false
    default: x86_64-linux
  cache_key_suffix:
    description: >-
      最小 FFmpeg 缓存键后缀。必须按构建基线区分（如 ubuntu2404/ubuntu2004/fedora/arch），
      否则老基线 job（如 ubuntu:20.04）会复用新基线构建的 FFmpeg（glibc 更高），
      反而抬高产物 glibc 需求。
    required: false
    default: linux
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        toolchain: stable
        # vault-rs 静态保险库：装 musl target 后 build.sh 自动走 musl 静态链接
        # （不依赖静态 glibc，Fedora 等未装 glibc-static 的发行版亦可；见 link-mode.sh）。
        targets: x86_64-unknown-linux-musl

    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26'
        cache-dependency-path: app/core/subsonic/go.sum

    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: '10.0.x'

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        cache: true

    # Zig 0.16（EraAudio kernel）。归档名按 0.15.1+ 新规则 zig-<arch>-<os>；
    # GITHUB_PATH 对当前步骤不生效，同步骤内用绝对路径验证。
    - name: Install Zig 0.16 (EraAudio kernel)
      shell: bash
      run: |
        set -euo pipefail
        VER=0.16.0
        ZA="${{ inputs.zig_archive }}"
        ZD="$HOME/.local/zig-$VER"
        if [ ! -x "$ZD/zig" ]; then
          mkdir -p "$HOME/.local"
          curl -fsSL "https://ziglang.org/download/$VER/zig-$ZA-$VER.tar.xz" -o /tmp/zig.tar.xz
          tar -C "$HOME/.local" -xf /tmp/zig.tar.xz
          mv "$HOME/.local/zig-$ZA-$VER" "$ZD"
        fi
        echo "$ZD" >> "$GITHUB_PATH"
        "$ZD/zig" version

    # 最小自包含 FFmpeg（内部编解码器 + 共享库 + RUNPATH=$ORIGIN）。发行版自带
    # 的 FFmpeg 链接大量外部视频/图像库（内嵌闭包 +236MB），音乐播放用不到；
    # 自建最小版只依赖 libc/libm/libz，内嵌约 10MB 且 soname 固定。
    - name: Cache minimal FFmpeg
      id: ffmpeg-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.local/ffmpeg-minimal
        # tls 段：自包含 mbedTLS 引入后旧缓存（无 .mbedtls-tls 标记）必须失效重建，
        # 否则命中旧前缀会导致每次运行都原地重编 FFmpeg。
        key: ffmpeg-minimal-9.0.1-tls-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_key_suffix }}

    - name: Build minimal FFmpeg
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash app/core/build-ffmpeg-minimal.sh

    - name: Point build at minimal FFmpeg
      shell: bash
      run: |
        PREFIX="$HOME/.local/ffmpeg-minimal"
        echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PREFIX/lib" >> "$GITHUB_ENV"

    # 原生模块一站式入口（audio-engine / scraper / scanner / indexer / vault /
    # downloader / subsonic / platform），逻辑只落一处，对齐 build_windows.bat。
    - name: Build native modules
      shell: bash
      run: bash app/core/build-linux.sh

    - name: Zig kernel tests (EraAudio 解码回归)
      shell: bash
      run: cd app/core/audio-engine && zig build test

    - name: Rust unit tests (archoerashell 原生 CLI)
      shell: bash
      # 内嵌原生 CLI 的单测（宽度/渲染/HTTP/参数解析/本地化），build.rs 从 ARB 生成
      # 帮助与标签文案。构建期由 flutter build 的 CMake 目标再编译为 staticlib 链入 runner。
      run: cargo test --release --manifest-path app/core/shell/Cargo.toml

    - name: Rust unit tests (downloader)
      shell: bash
      # 下载器：路径清洗 / 临时文件安全 / 标签 / 解析器向量（SEC-11/33 回归在此拦截）。
      run: cargo test --release --manifest-path app/core/downloader/Cargo.toml

    - name: Rust unit tests (subsonic transcoder)
      shell: bash
      run: cargo test --release --manifest-path app/core/subsonic/transcoder/Cargo.toml

    - name: Rust unit tests (vault-rs 静态保险库)
      shell: bash
      # 保险库纯函数单测（Argon2id RFC 9106 向量 / 恢复码 Crockford Base32 归一化）。
      # 全链路 E2E（init/serve/篡改/seccomp）见 app/core/vault-rs/test.sh（本地/真机运行）。
      run: cargo test --release --manifest-path app/core/vault-rs/Cargo.toml

    - name: Go unit tests (subsonic)
      shell: bash
      working-directory: app/core/subsonic
      # 子进程协议层：build / vet / test（SEC-01 凭据迁移与畸形密文回归）。
      run: |
        go build ./...
        go vet ./...
        go test ./...

    - name: Flutter pub get
      shell: bash
      working-directory: app
      run: flutter pub get

    - name: Analyze
      shell: bash
      working-directory: app
      run: dart analyze lib

    # SEC-27：跑**完整** Flutter 测试套件（不再只跑 widget 冒烟 + vault 单文件）。
    # 原生模块（scanner / indexer / audio-engine / downloader / platform）已在上面构建，
    # 相关 FFI 用例可正常加载；vault 用例经环境变量指向测试二进制。
    - name: Test (full flutter suite)
      shell: bash
      working-directory: app
      env:
        # headless runner 无 D-Bus Secret Service：构建测试二进制（vault_testing
        # feature 条件编译，与生产唯一区别是构建标记为 TEST；存储行为完全一致），
        # 并经 ARCHOERA_VAULT_BACKEND=file 选择**生产 FileStore**（文件密钥后端）——
        # SEC-19 后不再有测试专用明文存储后门。
        # Linux 已改用 vault-rs 的 Rust 静态单文件（core/vault-rs，免疫 LD_PRELOAD）；
        # 指向绝对路径，避免 working-directory 相对解析。
        ARCHOERA_VAULT_BIN: ${{ github.workspace }}/app/core/vault-rs/build/archoera-vault-test
        ARCHOERA_VAULT_BACKEND: 'file'
      run: |
        set -euo pipefail
        bash core/vault-rs/build-test.sh
        flutter test

    - name: Build Flutter Linux (release)
      shell: bash
      working-directory: app
      run: flutter build linux --release

    # 自包含运行库：把 FFmpeg/TagLib 的传递依赖闭包收进 native/ 并加 RUNPATH=$ORIGIN，
    # 产物不再依赖目标发行版的 soname（防系统库差异/升级导致加载断裂）。
    - name: Bundle self-contained runtime libs
      shell: bash
      run: bash app/core/bundle-linux-runtime.sh app/build/linux/x64/release/bundle

    - name: Verify indexer-ffi bundled (Linux)
      shell: bash
      # 硬校验：本地曲库搜索索引器（indexer-ffi.so）及其 SQLite 依赖必须进
      # bundle/native/，且计入 SHA-256 完整性清单（SEC-08，由 bundle-linux-runtime.sh
      # 末尾调用的 gen_native_manifest.sh 生成）。
      run: |
        set -euo pipefail
        NATIVE=app/build/linux/x64/release/bundle/native
        for f in indexer-ffi.so libe_sqlite3.so; do
          [ -f "$NATIVE/$f" ] || { echo "::error::$f 未打入 Linux bundle"; exit 1; }
        done
        grep -q 'indexer-ffi.so' "$NATIVE/ARCHOERA-NATIVE-MANIFEST.txt" \
          || { echo "::error::完整性清单缺 indexer-ffi.so"; exit 1; }
        echo "OK: indexer-ffi 已入包并计入清单"

    # LGPL 合规：随包附 FFmpeg / TagLib 许可文本 + 聚合声明（见根 THIRD-PARTY-NOTICES.md）
    - name: Bundle third-party licenses (LGPL 合规)
      shell: bash
      run: bash app/core/bundle-licenses.sh app/build/linux/x64/release/bundle

    - name: Embed public key into Linux bundle (防伪)
      shell: bash
      run: cp app/tool/watermark_pub.pem app/build/linux/x64/release/bundle/ARCHOERA_PUBKEY.pem
