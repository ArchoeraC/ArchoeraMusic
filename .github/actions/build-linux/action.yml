name: Build ArchoeraMusic (Linux)
description: >-
  各发行版共用的 Linux 构建：安装工具链（Rust/Go/.NET/Flutter/Zig）→
  编译全部原生模块 → dart analyze → flutter build linux。
  测试不在此执行（本地按 AGENTS.md 的提交前门禁跑），CI 只做编译与打包。
  发行版专属的系统依赖安装与打包步骤由调用方 job 负责（复合 action 在调用方
  job 的容器/runner 内执行，因此天然复用各发行版的本地库）。
inputs:
  zig_archive:
    description: Zig 官方归档后缀（如 x86_64-linux）
    required: false
    default: x86_64-linux
  cache_key_suffix:
    description: >-
      最小 FFmpeg 缓存键后缀。必须按构建基线区分（如 ubuntu2404/ubuntu2004/fedora/arch），
      否则老基线 job（如 ubuntu:20.04）会复用新基线构建的 FFmpeg（glibc 更高），
      反而抬高产物 glibc 需求。
    required: false
    default: linux
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        toolchain: stable
        # vault-rs 静态保险库：装 musl target 后 build.sh 自动走 musl 静态链接
        # （不依赖静态 glibc，Fedora 等未装 glibc-static 的发行版亦可；见 link-mode.sh）。
        targets: x86_64-unknown-linux-musl

    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26'
        cache-dependency-path: app/core/subsonic/go.sum

    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: '10.0.x'

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        cache: true

    # Zig 0.17（EraAudio kernel）。归档名按 0.15.1+ 新规则 zig-<arch>-<os>；
    # GITHUB_PATH 对当前步骤不生效，同步骤内用绝对路径验证。
    - name: Install Zig 0.17 (EraAudio kernel)
      shell: bash
      run: |
        set -euo pipefail
        VER=0.17.0
        ZA="${{ inputs.zig_archive }}"
        ZD="$HOME/.local/zig-$VER"
        if [ ! -x "$ZD/zig" ]; then
          mkdir -p "$HOME/.local"
          curl -fsSL "https://ziglang.org/download/$VER/zig-$ZA-$VER.tar.xz" -o /tmp/zig.tar.xz
          tar -C "$HOME/.local" -xf /tmp/zig.tar.xz
          mv "$HOME/.local/zig-$ZA-$VER" "$ZD"
        fi
        echo "$ZD" >> "$GITHUB_PATH"
        "$ZD/zig" version

    # 最小自包含 FFmpeg（内部编解码器 + 共享库 + RUNPATH=$ORIGIN）。发行版自带
    # 的 FFmpeg 链接大量外部视频/图像库（内嵌闭包 +236MB），音乐播放用不到；
    # 自建最小版只依赖 libc/libm/libz，内嵌约 10MB 且 soname 固定。
    - name: Cache minimal FFmpeg
      id: ffmpeg-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.local/ffmpeg-minimal
        # tls 段：自包含 mbedTLS 引入后旧缓存（无 .mbedtls-tls 标记）必须失效重建，
        # 否则命中旧前缀会导致每次运行都原地重编 FFmpeg。
        key: ffmpeg-minimal-9.0.1-tls-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_key_suffix }}

    - name: Build minimal FFmpeg
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash app/core/build-ffmpeg-minimal.sh

    - name: Point build at minimal FFmpeg
      shell: bash
      run: |
        PREFIX="$HOME/.local/ffmpeg-minimal"
        echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PREFIX/lib" >> "$GITHUB_ENV"

    # 原生模块（audio-engine / scraper / scanner / indexer / vault / subsonic /
    # platform）→ dart analyze → flutter build linux：
    # 逻辑只落一处（与 build_windows.bat / build-macos.sh 对齐）。
    - name: Build native modules + Flutter Linux
      shell: bash
      run: bash packaging/linux/build-release.sh build

    # 自包含运行库（FFmpeg/TagLib 收拢 + RUNPATH=$ORIGIN）+ 许可文本 + 公钥。
    - name: Prepare Linux bundle (runtime libs / licenses / pubkey)
      shell: bash
      run: bash packaging/linux/build-release.sh prepare

    # 依赖守卫（NEEDED / $ORIGIN / 内嵌库实际解析位置 / libssl·libcrypto·libcurl
    # 禁止项）+ 伴随库在包内 + Xvfb 启动冒烟，全部收敛在 Linux 专用脚本里。
    - name: Verify Linux bundle (deps guard + Xvfb smoke)
      shell: bash
      env:
        ARCHOERA_SMOKE_SECONDS: "15"
      run: bash packaging/linux/build-release.sh verify
