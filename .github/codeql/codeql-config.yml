# ArchoeraMusic CodeQL 配置（c-cpp）
#
# 排除随源码引入（vendored）的第三方单文件库：它们由上游维护，安全修复
# 走「升级到上游新版本」而不是在本仓库逐条改动。
#
#   - kernel/c/stb_vorbis.c   stb_vorbis v1.22（public domain），独立编译单元
#   - include/miniaudio.h     miniaudio v0.11.25（MIT-0 / public domain）
#
# 注意：CodeQL 的 paths-ignore 对**被 src/*.c #include 的头文件**不生效
# （头文件内容随源文件一起被提取）。因此 miniaudio.h 不能靠这里排除：
# 它的整数乘法告警在 2026-10-27 按 `won't fix` 逐条 dismiss，并在
# `.github/codeql/filter_sarif.py` 中按 SARIF 路径过滤后再上传，避免
# 后续扫描重复产生；升级 miniaudio 后需复核是否出现新告警。
# stb_vorbis.c 是独立编译单元，可正常排除。
#
# 自研代码（src/*.c、kernel/*.zig、app/native/**）仍全量扫描；不要为了
# 「清零告警」把 src/ 或 app/native/ 加进 paths-ignore。
name: ArchoeraMusic CodeQL config
paths-ignore:
  - app/core/audio-engine/kernel/c/stb_vorbis.c
